services:
  postgres:
    image: postgres:17-alpine
    container_name: elevate-lead-dispatcher-postgres
    environment:
      POSTGRES_DB: elevate_lead_dispatcher
      POSTGRES_USER: elevate
      POSTGRES_PASSWORD: elevate
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-database.sql:/docker-entrypoint-initdb.d/init-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elevate -d elevate_lead_dispatcher"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: elevate-lead-dispatcher-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
