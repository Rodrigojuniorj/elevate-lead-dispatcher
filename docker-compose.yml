services:
  postgres:
    image: postgres:17-alpine
    container_name: elevate-lead-dispatcher-postgres
    environment:
      POSTGRES_DB: elevate_lead_dispatcher
      POSTGRES_USER: elevate
      POSTGRES_PASSWORD: elevate
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elevate -d elevate_lead_dispatcher"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
